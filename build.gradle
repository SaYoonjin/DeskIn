plugins {
	id 'java'
	id 'org.springframework.boot' version '3.3.4'
	id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.deskin'
version = '0.0.1-SNAPSHOT'

// Spring Boot 3.3.4가 관리하는 기본 버전(1.19.8)은 최신 Docker Engine(29.x)이 요구하는
// 최소 API 버전(1.40)보다 낮은 클라이언트로 통신해 400 에러가 난다. 버전을 올려 회피한다.
ext['testcontainers.version'] = '1.20.4'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Web / Validation
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Persistence
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'org.postgresql:postgresql'

	// Security / JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// Batch
	implementation 'org.springframework.boot:spring-boot-starter-batch'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'postgresql'
	}
}

tasks.register('postgresTest', Test) {
	description = 'Docker의 PostgreSQL로 동시성 및 제약 조건을 검증합니다.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'postgresql'
	}
	shouldRunAfter tasks.named('test')
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
