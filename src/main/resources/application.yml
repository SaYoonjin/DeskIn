spring:
  application:
    name: deskIn
  profiles:
    active: local

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  batch:
    job:
      enabled: false # 스케줄러/수동 트리거로만 실행 (앱 기동 시 자동 실행 방지)
    jdbc:
      initialize-schema: always

auth:
  refresh-token-duration: 7d
  allowed-origins: ${AUTH_ALLOWED_ORIGINS}
  rate-limit-max-attempts: 5
  rate-limit-window: 1m

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/deskin}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: 900000
  issuer: deskin
  audience: deskin-web

auth:
  allowed-origins: ${AUTH_ALLOWED_ORIGINS:http://localhost:3000}

toss:
  secret-key: ${TOSS_SECRET_KEY:}
  client-key: ${TOSS_CLIENT_KEY:}
  base-url: https://api.tosspayments.com

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-ms: 900000
  issuer: deskin
  audience: deskin-web

toss:
  secret-key: ${TOSS_SECRET_KEY}
  client-key: ${TOSS_CLIENT_KEY}
  base-url: https://api.tosspayments.com
