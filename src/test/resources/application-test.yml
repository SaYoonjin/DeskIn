spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  batch:
    jdbc:
      initialize-schema: never

jwt:
  secret: test-only-secret-with-at-least-32-bytes
  access-token-expire-ms: 900000
  issuer: deskin
  audience: deskin-web

auth:
  refresh-token-duration: 7d
  allowed-origins: http://localhost:3000
