spring:
  datasource:
    url: jdbc:h2:mem:deskin;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  batch:
    jdbc:
      initialize-schema: never

jwt:
  secret: test-only-secret-with-at-least-32-bytes
  access-token-expire-ms: 900000
  issuer: deskin
  audience: deskin-web

auth:
  session-duration: 7d
  cookie-secure: false
  allowed-origins: http://localhost:3000
